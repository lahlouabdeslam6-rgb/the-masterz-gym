services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masterz_gym}
      POSTGRES_USER: ${POSTGRES_USER:-masterz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masterz_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masterz} -d ${POSTGRES_DB:-masterz_gym}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://masterz:masterz_local_only@postgres:5432/masterz_gym}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GYM_TIMEZONE: ${GYM_TIMEZONE:-Africa/Casablanca}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-masterz-local-jwt-secret-change-me-2026}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-masterz-local-refresh-secret-change-me-2026}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost:13000"]}'
      API_HOST: 0.0.0.0
      API_PORT: 8000
      STORE_MEDIA_ROOT: /data/store-products
      MEMBER_PHOTO_ROOT: /data/member-photos
      COACHING_MEDIA_ROOT: /data/coaching-media
    ports:
      - "${MASTERZ_API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - store_media:/data/store-products
      - member_photos:/data/member-photos
      - coaching_media:/data/coaching-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_CHROME_EXECUTABLE: /usr/bin/chromium
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      TZ: ${GYM_TIMEZONE:-Africa/Casablanca}
      WATCHPACK_POLLING: "true"
    ports:
      - "${MASTERZ_WEB_PORT:-13000}:3000"
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./packages:/workspace/packages
      - web_node_modules:/workspace/node_modules
      - web_next:/workspace/apps/web/.next
      - web_next_dev:/workspace/apps/web/.next-dev
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  web_node_modules:
  web_next:
  web_next_dev:
  store_media:
  member_photos:
  coaching_media:
